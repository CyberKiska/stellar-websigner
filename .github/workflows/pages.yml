name: Deploy external-wallet-only preview to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Full security and build gate
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          LOCAL_SECRET_POLICY: disabled
        run: npm run check

      - name: Remove unsupported response-header marker
        # GitHub Pages cannot serve _headers. Drop it from the manifest as well so the uploaded
        # artifact still passes exact-set verification.
        run: |
          rm -f dist/_headers
          grep -v '  _headers$' dist/artifact-manifest.sha256 > dist/artifact-manifest.tmp
          mv dist/artifact-manifest.tmp dist/artifact-manifest.sha256
          npm run verify:artifact

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
